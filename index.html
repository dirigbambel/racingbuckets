<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Календарь автогонок</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #181b24;
      --surface-hover: #202430;
      --border: #2a2f3d;
      --text: #e6e8ef;
      --muted: #8f96a8;
      --accent: #e10600;
      --tg: #2aabee;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px 48px;
    }

    body.modal-open {
      overflow: hidden;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    h1 {
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .tz-info {
      font-size: 0.84rem;
      color: var(--muted);
    }

    .tg-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .tg-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .tg-pill svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      opacity: 0.85;
      transition: fill 0.15s, opacity 0.15s;
    }

    .tg-pill:hover {
      color: var(--text);
      border-color: rgba(42, 171, 238, 0.55);
      background: rgba(42, 171, 238, 0.08);
    }

    .tg-pill:hover svg {
      fill: var(--tg);
      opacity: 1;
    }

    .filters {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .filter-group label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    select, input[type="date"], input[type="text"] {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.92rem;
      outline: none;
      width: 100%;
    }

    select:focus, input:focus {
      border-color: var(--accent);
    }

    .filter-actions {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
    }

    .btn-reset {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.15s;
    }

    .btn-reset:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    .stats {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .race-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--series-color, var(--accent));
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.15s, background 0.15s, border-color 0.15s;
      cursor: pointer;
    }

    .card:hover {
      background: var(--surface-hover);
      transform: translateY(-2px);
      border-color: #3a4154;
      border-left-color: var(--series-color, var(--accent));
    }

    .card.past {
      opacity: 0.65;
    }

    .card.past:hover {
      opacity: 0.9;
    }

    .card.next-up {
      box-shadow: 0 0 0 1px rgba(225, 6, 0, 0.5);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .card-top-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .series-badge {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--series-color, #fff);
    }

    .flag-icon {
      width: 22px;
      height: 15px;
      object-fit: cover;
      border-radius: 3px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16);
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .country-fallback {
      font-size: 0.76rem;
      color: var(--muted);
    }

    .pill {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--muted);
      white-space: nowrap;
    }

    .pill.next-badge {
      background: rgba(225, 6, 0, 0.2);
      color: #ff6b66;
      font-weight: 600;
    }

    .race-title {
      font-size: 1.12rem;
      font-weight: 600;
    }

    .race-meta {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .race-time {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .countdown {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .card-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .watch-link, .details-hint {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .details-hint {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .card:hover .details-hint {
      color: var(--text);
      border-color: #464e63;
    }

    .watch-link {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .watch-link:hover {
      background: rgba(255, 255, 255, 0.11);
      border-color: var(--series-color, var(--muted));
    }

    .empty, .error {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--muted);
    }

    .error code {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 8px;
      background: var(--bg);
      border-radius: 6px;
      color: var(--text);
    }

    /* Модальное окно */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(7, 9, 13, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 680px;
      max-height: 88vh;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 4px solid var(--modal-color, var(--accent));
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    .modal-header {
      padding: 18px 20px 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-top: 4px;
      line-height: 1.25;
    }

    .modal-subtitle {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .modal-tags {
      margin-top: 8px;
    }

    .modal-close {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      transition: 0.15s;
    }

    .modal-close:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    .modal-tabs {
      display: flex;
      gap: 4px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.15);
      overflow-x: auto;
    }

    .tab-btn {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      padding: 11px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      color: var(--text);
      border-bottom-color: var(--modal-color, var(--accent));
    }

    .modal-body {
      padding: 18px 20px 22px;
      overflow-y: auto;
    }

    .session-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .session-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
    }

    .session-row.is-main {
      border-color: var(--modal-color, var(--accent));
      background: rgba(255, 255, 255, 0.03);
    }

    .session-row.is-past {
      opacity: 0.55;
    }

    .session-name {
      font-weight: 600;
      font-size: 0.94rem;
    }

    .session-date {
      text-align: right;
      font-size: 0.88rem;
      white-space: nowrap;
    }

    .session-day {
      color: var(--muted);
      margin-right: 8px;
      font-size: 0.82rem;
    }

    .sub-tabs {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .sub-tab-group {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 4px;
    }

    .sub-tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .sub-tab-btn.active {
      background: var(--surface-hover);
      color: var(--text);
    }

    .updated-note {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .table-wrap {
      overflow-x: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    .data-table th {
      text-align: left;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    .data-table td {
      padding: 9px 10px;
      border-bottom: 1px solid rgba(42, 47, 61, 0.6);
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }

    .col-pos {
      width: 42px;
      font-weight: 700;
      color: var(--muted);
    }

    .pos-1 { color: #facc15; }
    .pos-2 { color: #cbd5e1; }
    .pos-3 { color: #d97706; }

    .col-num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .col-muted {
      color: var(--muted);
    }

    .modal-note {
      margin-top: 12px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .modal-watch {
      margin-top: 16px;
      display: inline-flex;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-main">
        <h1>Календарь гонок</h1>
        <div class="tz-info" id="tzInfo"></div>
      </div>

      <nav class="tg-links" aria-label="Telegram-каналы">
        <a class="tg-pill" href="https://t.me/racing_journalf1" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
          @racing_journalf1
        </a>
        <a class="tg-pill" href="https://t.me/racingbuckets" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
          @racingbuckets
        </a>
      </nav>
    </header>

    <section class="filters">
      <div class="filter-group">
        <label for="fSeries">Серия</label>
        <select id="fSeries"><option value="">Все серии</option></select>
      </div>

      <div class="filter-group">
        <label for="fTag">Класс / тип</label>
        <select id="fTag"><option value="">Любые</option></select>
      </div>

      <div class="filter-group">
        <label for="fCountry">Страна</label>
        <select id="fCountry"><option value="">Все страны</option></select>
      </div>

      <div class="filter-group">
        <label for="fFrom">Дата от</label>
        <input type="date" id="fFrom">
      </div>

      <div class="filter-group">
        <label for="fTo">Дата до</label>
        <input type="date" id="fTo">
      </div>

      <div class="filter-group">
        <label for="fSearch">Поиск</label>
        <input type="text" id="fSearch" placeholder="Трасса, тег, этап...">
      </div>

      <div class="filter-actions">
        <label class="checkbox-label">
          <input type="checkbox" id="fHidePast" checked>
          Скрыть прошедшие гонки
        </label>
        <button class="btn-reset" id="btnReset">Сбросить фильтры</button>
      </div>
    </section>

    <div class="stats" id="stats"></div>
    <main class="race-list" id="raceList"></main>
  </div>

  <!-- Модальное окно этапа -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal" id="modalBox">
      <div class="modal-header">
        <div>
          <span class="series-badge" id="modalSeries"></span>
          <h2 class="modal-title" id="modalTitle"></h2>
          <div class="modal-subtitle" id="modalSubtitle"></div>
          <div class="tag-list modal-tags" id="modalTags"></div>
        </div>
        <button class="modal-close" id="modalClose" aria-label="Закрыть">&times;</button>
      </div>
      <div class="modal-tabs" id="modalTabs"></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    // --- НАСТРОЙКИ ---
    const ENABLE_MODAL = true;      // false — убрать всплывающее окно вообще
    const SHOW_RESULTS = false;     // true — показать вкладку «Результаты»
    const SHOW_STANDINGS = false;   // true — показать вкладку «Таблица чемпионата»

    const DEFAULT_WATCH_URL = '';
    const DEFAULT_WATCH_LABEL = 'Где смотреть';

    // Словарь «Название страны -> ISO-код для флага» (можно дополнять)
    const COUNTRY_CODES = {
      'австралия': 'au', 'австрия': 'at', 'азербайджан': 'az', 'аргентина': 'ar', 'армения': 'am',
      'бахрейн': 'bh', 'беларусь': 'by', 'белоруссия': 'by', 'бельгия': 'be', 'болгария': 'bg', 'бразилия': 'br',
      'великобритания': 'gb', 'англия': 'gb', 'венгрия': 'hu', 'вьетнам': 'vn',
      'германия': 'de', 'греция': 'gr', 'грузия': 'ge',
      'дания': 'dk', 'египет': 'eg',
      'израиль': 'il', 'индия': 'in', 'индонезия': 'id', 'ирландия': 'ie', 'исландия': 'is', 'испания': 'es', 'италия': 'it',
      'казахстан': 'kz', 'канада': 'ca', 'катар': 'qa', 'кения': 'ke', 'кипр': 'cy', 'китай': 'cn', 'колумбия': 'co', 'корея': 'kr', 'южная корея': 'kr',
      'латвия': 'lv', 'литва': 'lt', 'люксембург': 'lu',
      'малайзия': 'my', 'марокко': 'ma', 'мексика': 'mx', 'монако': 'mc',
      'нидерланды': 'nl', 'голландия': 'nl', 'новая зеландия': 'nz', 'норвегия': 'no',
      'оаэ': 'ae', 'эмираты': 'ae', 'оман': 'om',
      'парагвай': 'py', 'перу': 'pe', 'польша': 'pl', 'португалия': 'pt',
      'россия': 'ru', 'рф': 'ru', 'румыния': 'ro',
      'сан-марино': 'sm', 'саудовская аравия': 'sa', 'сербия': 'rs', 'сингапур': 'sg', 'словакия': 'sk', 'словения': 'si', 'сша': 'us',
      'таиланд': 'th', 'тайвань': 'tw', 'турция': 'tr',
      'узбекистан': 'uz', 'украина': 'ua', 'уругвай': 'uy',
      'финляндия': 'fi', 'франция': 'fr',
      'хорватия': 'hr', 'черногория': 'me', 'чехия': 'cz', 'чили': 'cl',
      'швейцария': 'ch', 'швеция': 'se', 'эстония': 'ee', 'юар': 'za', 'япония': 'jp'
    };

    // Теги, которые всегда показываются вверху списка фильтра
    const PRIORITY_TAGS = ['Открытые колеса', 'Закрытые колеса'];

    const els = {
      series: document.getElementById('fSeries'),
      tag: document.getElementById('fTag'),
      country: document.getElementById('fCountry'),
      from: document.getElementById('fFrom'),
      to: document.getElementById('fTo'),
      search: document.getElementById('fSearch'),
      hidePast: document.getElementById('fHidePast'),
      reset: document.getElementById('btnReset'),
      list: document.getElementById('raceList'),
      stats: document.getElementById('stats'),
      tzInfo: document.getElementById('tzInfo'),
      backdrop: document.getElementById('modalBackdrop'),
      modalBox: document.getElementById('modalBox'),
      modalSeries: document.getElementById('modalSeries'),
      modalTitle: document.getElementById('modalTitle'),
      modalSubtitle: document.getElementById('modalSubtitle'),
      modalTags: document.getElementById('modalTags'),
      modalTabs: document.getElementById('modalTabs'),
      modalBody: document.getElementById('modalBody'),
      modalClose: document.getElementById('modalClose')
    };

    let allRaces = [];
    let standingsData = {};
    let currentRace = null;
    let activeTab = 'schedule';
    let activeStandingsType = 'drivers';

    const LIVE_WINDOW_MS = 3 * 60 * 60 * 1000;
    const userTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    els.tzInfo.textContent = `Часовой пояс: ${userTz}`;

    const escapeHtml = (str = '') =>
      String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

    const safeUrl = (url = '') => {
      const trimmed = String(url).trim();
      return /^https?:\/\//i.test(trimmed) ? trimmed : '';
    };

    function getCountryCode(country) {
      const key = String(country || '').trim().toLowerCase();
      if (!key) return '';
      if (COUNTRY_CODES[key]) return COUNTRY_CODES[key];
      if (/^[a-z]{2}$/.test(key)) return key;
      return '';
    }

    function renderFlag(country) {
      const name = String(country || '').trim();
      if (!name) return '';
      const code = getCountryCode(name);
      const safeName = escapeHtml(name);
      if (!code) return `<span class="country-fallback">${safeName}</span>`;
      return `<img class="flag-icon" src="https://flagcdn.com/w40/${code}.png" srcset="https://flagcdn.com/w80/${code}.png 2x" alt="${safeName}" title="${safeName}" loading="lazy">`;
    }

    function normalizeTags(race) {
      if (Array.isArray(race.tags) && race.tags.length) {
        return race.tags.map(t => String(t).trim()).filter(Boolean);
      }
      if (typeof race.tags === 'string' && race.tags.trim()) {
        return race.tags.split(/[,;]+/).map(t => t.trim()).filter(Boolean);
      }
      if (race.wheels === 'open') return ['Открытые колеса'];
      if (race.wheels === 'closed') return ['Закрытые колеса'];
      return [];
    }

    function populateSelect(selectEl, values, priority = []) {
      const unique = [...new Set(values.filter(Boolean))];
      unique.sort((a, b) => {
        const pa = priority.indexOf(a);
        const pb = priority.indexOf(b);
        if (pa !== -1 || pb !== -1) {
          if (pa === -1) return 1;
          if (pb === -1) return -1;
          return pa - pb;
        }
        return a.localeCompare(b, 'ru');
      });
      unique.forEach(val => {
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = val;
        selectEl.appendChild(opt);
      });
    }

    function formatCountdown(msDiff) {
      if (msDiff < -LIVE_WINDOW_MS) return 'Завершена';
      if (msDiff <= 0) return 'Идет сейчас';

      const totalHours = Math.floor(msDiff / (1000 * 60 * 60));
      const days = Math.floor(totalHours / 24);
      const hours = totalHours % 24;

      if (days > 0) return `Через ${days} дн. ${hours} ч.`;
      const mins = Math.floor((msDiff / (1000 * 60)) % 60);
      return hours > 0 ? `Через ${hours} ч. ${mins} м.` : `Через ${mins} мин.`;
    }

    function render() {
      const now = Date.now();
      const seriesVal = els.series.value;
      const tagVal = els.tag.value;
      const countryVal = els.country.value;
      const fromTs = els.from.value ? new Date(els.from.value + 'T00:00:00').getTime() : null;
      const toTs = els.to.value ? new Date(els.to.value + 'T23:59:59').getTime() : null;
      const query = els.search.value.trim().toLowerCase();
      const hidePast = els.hidePast.checked;

      const filtered = allRaces.filter(r => {
        const ts = r._ts;
        if (hidePast && ts < now - LIVE_WINDOW_MS) return false;
        if (seriesVal && r.series !== seriesVal) return false;
        if (tagVal && !r._tags.includes(tagVal)) return false;
        if (countryVal && r.country !== countryVal) return false;
        if (fromTs && ts < fromTs) return false;
        if (toTs && ts > toTs) return false;
        if (query) {
          const hay = `${r.series} ${r.name} ${r.circuit} ${r.country} ${r._tags.join(' ')}`.toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      const nextUpcoming = filtered.find(r => r._ts >= now - LIVE_WINDOW_MS);
      els.stats.textContent = `Найдено этапов: ${filtered.length}`;

      if (!filtered.length) {
        els.list.innerHTML = '<div class="empty">По выбранным фильтрам гонок нет.</div>';
        return;
      }

      els.list.innerHTML = filtered.map(r => {
        const diff = r._ts - now;
        const isPast = diff < -LIVE_WINDOW_MS;
        const isNext = nextUpcoming && r === nextUpcoming;

        const watchUrl = safeUrl(r.watch || DEFAULT_WATCH_URL);
        const watchLabel = escapeHtml(r.watchLabel || DEFAULT_WATCH_LABEL);
        const showWatch = Boolean(watchUrl && !isPast);
        const showActions = ENABLE_MODAL || showWatch;

        const formattedDate = new Date(r._ts).toLocaleString('ru-RU', {
          day: 'numeric',
          month: 'short',
          weekday: 'short',
          hour: '2-digit',
          minute: '2-digit'
        });

        const hasResults = SHOW_RESULTS && r.results?.length;
        const detailLabel = isPast && hasResults ? 'Результаты' : 'Подробнее';
        const cardStyle = `--series-color: ${escapeHtml(r.color || '#e10600')}${ENABLE_MODAL ? '' : '; cursor: default'}`;

        const tagsHtml = r._tags.length
          ? `<div class="tag-list">${r._tags.map(t => `<span class="pill">${escapeHtml(t)}</span>`).join('')}</div>`
          : '';

        return `
          <article class="card ${isPast ? 'past' : ''} ${isNext ? 'next-up' : ''}"
                   data-id="${r._id}"
                   style="${cardStyle}">
            <div class="card-top">
              <span class="series-badge">${escapeHtml(r.series)}</span>
              <div class="card-top-right">
                ${isNext ? '<span class="pill next-badge">Ближайшая</span>' : ''}
                ${renderFlag(r.country)}
              </div>
            </div>
            <div class="race-title">${escapeHtml(r.name)}</div>
            ${r.circuit ? `<div class="race-meta">Трасса: ${escapeHtml(r.circuit)}</div>` : ''}
            ${tagsHtml}
            <div class="card-footer">
              <div class="race-time">
                <strong>${formattedDate}</strong>
                <span class="countdown">${formatCountdown(diff)}</span>
              </div>
              ${showActions ? `
                <div class="card-actions">
                  ${ENABLE_MODAL ? `<span class="details-hint">${detailLabel}</span>` : ''}
                  ${showWatch
                    ? `<a class="watch-link" href="${escapeHtml(watchUrl)}" target="_blank" rel="noopener noreferrer">▶ ${watchLabel} ↗</a>`
                    : ''
                  }
                </div>
              ` : ''}
            </div>
          </article>
        `;
      }).join('');
    }

    /* --- Логика модального окна --- */
    function getAvailableTabs(race) {
      const tabs = [{ id: 'schedule', label: 'Расписание уик-энда' }];
      if (SHOW_RESULTS && Array.isArray(race.results) && race.results.length) {
        tabs.push({ id: 'results', label: 'Результаты' });
      }
      if (SHOW_STANDINGS) {
        const st = standingsData[race.series];
        if (st && (st.drivers?.length || st.teams?.length)) {
          tabs.push({ id: 'standings', label: 'Таблица чемпионата' });
        }
      }
      return tabs;
    }

    function openModal(race) {
      currentRace = race;
      const color = race.color || '#e10600';
      const isPast = race._ts < Date.now() - LIVE_WINDOW_MS;

      els.modalBox.style.setProperty('--modal-color', color);
      els.modalSeries.style.color = color;
      els.modalSeries.textContent = race.series;
      els.modalTitle.textContent = race.name;
      els.modalSubtitle.innerHTML = `${renderFlag(race.country)} <span>${escapeHtml(race.circuit || race.country || '')}</span>`;
      els.modalTags.innerHTML = race._tags.map(t => `<span class="pill">${escapeHtml(t)}</span>`).join('');

      const tabs = getAvailableTabs(race);
      activeTab = (isPast && tabs.some(t => t.id === 'results')) ? 'results' : 'schedule';

      const st = standingsData[race.series];
      activeStandingsType = st?.drivers?.length ? 'drivers' : 'teams';

      renderModalContent();
      els.backdrop.classList.add('open');
      document.body.classList.add('modal-open');
    }

    function closeModal() {
      els.backdrop.classList.remove('open');
      document.body.classList.remove('modal-open');
      currentRace = null;
    }

    function renderModalContent() {
      if (!currentRace) return;
      const tabs = getAvailableTabs(currentRace);

      if (tabs.length <= 1) {
        els.modalTabs.style.display = 'none';
        els.modalTabs.innerHTML = '';
      } else {
        els.modalTabs.style.display = '';
        els.modalTabs.innerHTML = tabs.map(t => `
          <button class="tab-btn ${t.id === activeTab ? 'active' : ''}" data-tab="${t.id}">
            ${t.label}
          </button>
        `).join('');
      }

      if (activeTab === 'schedule') renderScheduleTab(currentRace);
      else if (activeTab === 'results') renderResultsTab(currentRace);
      else if (activeTab === 'standings') renderStandingsTab(currentRace);
    }

    function renderScheduleTab(race) {
      const now = Date.now();
      const hasFull = Array.isArray(race.sessions) && race.sessions.length > 0;
      const sessions = hasFull
        ? [...race.sessions].sort((a, b) => new Date(a.start) - new Date(b.start))
        : [{ name: 'Старт гонки', start: race.start, main: true }];

      const watchUrl = safeUrl(race.watch || DEFAULT_WATCH_URL);
      const watchLabel = escapeHtml(race.watchLabel || DEFAULT_WATCH_LABEL);
      const isPastRace = race._ts < now - LIVE_WINDOW_MS;

      const rows = sessions.map(s => {
        const ts = new Date(s.start).getTime();
        const isPast = ts < now - LIVE_WINDOW_MS;
        const d = new Date(ts);
        const dayStr = d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
        const timeStr = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

        return `
          <div class="session-row ${s.main ? 'is-main' : ''} ${isPast ? 'is-past' : ''}">
            <span class="session-name">${escapeHtml(s.name)}</span>
            <span class="session-date">
              <span class="session-day">${dayStr}</span>
              <strong>${timeStr}</strong>
            </span>
          </div>
        `;
      }).join('');

      els.modalBody.innerHTML = `
        <div class="session-list">${rows}</div>
        ${!hasFull ? '<p class="modal-note">Подробное расписание сессий для этого этапа пока не добавлено.</p>' : ''}
        ${watchUrl && !isPastRace
          ? `<a class="watch-link modal-watch" href="${escapeHtml(watchUrl)}" target="_blank" rel="noopener noreferrer">▶ ${watchLabel} ↗</a>`
          : ''
        }
      `;
    }

    function renderResultsTab(race) {
      const rows = race.results || [];
      const hasTeam = rows.some(r => r.team);
      const hasTime = rows.some(r => r.time);
      const hasPoints = rows.some(r => r.points !== undefined && r.points !== '');

      const body = rows.map((r, i) => {
        const pos = r.pos ?? (i + 1);
        const posClass = pos <= 3 ? `pos-${pos}` : '';
        return `
          <tr>
            <td class="col-pos ${posClass}">${escapeHtml(pos)}</td>
            <td><strong>${escapeHtml(r.driver || r.name || '')}</strong></td>
            ${hasTeam ? `<td class="col-muted">${escapeHtml(r.team || '—')}</td>` : ''}
            ${hasTime ? `<td class="col-num col-muted">${escapeHtml(r.time || '—')}</td>` : ''}
            ${hasPoints ? `<td class="col-num"><strong>${escapeHtml(r.points ?? '—')}</strong></td>` : ''}
          </tr>
        `;
      }).join('');

      els.modalBody.innerHTML = `
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Пилот / Экипаж</th>
                ${hasTeam ? '<th>Команда</th>' : ''}
                ${hasTime ? '<th class="col-num">Время</th>' : ''}
                ${hasPoints ? '<th class="col-num">Очки</th>' : ''}
              </tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    function renderStandingsTab(race) {
      const st = standingsData[race.series];
      if (!st) return;

      const hasDrivers = Array.isArray(st.drivers) && st.drivers.length > 0;
      const hasTeams = Array.isArray(st.teams) && st.teams.length > 0;
      const rows = activeStandingsType === 'drivers' ? (st.drivers || []) : (st.teams || []);
      const hasTeamCol = activeStandingsType === 'drivers' && rows.some(r => r.team);

      const subTabsHtml = (hasDrivers && hasTeams) ? `
        <div class="sub-tab-group">
          <button class="sub-tab-btn ${activeStandingsType === 'drivers' ? 'active' : ''}" data-st="drivers">Личный зачёт</button>
          <button class="sub-tab-btn ${activeStandingsType === 'teams' ? 'active' : ''}" data-st="teams">Команды</button>
        </div>
      ` : '<div></div>';

      const body = rows.map((r, i) => {
        const pos = r.pos ?? (i + 1);
        const posClass = pos <= 3 ? `pos-${pos}` : '';
        return `
          <tr>
            <td class="col-pos ${posClass}">${escapeHtml(pos)}</td>
            <td><strong>${escapeHtml(r.name || '')}</strong></td>
            ${hasTeamCol ? `<td class="col-muted">${escapeHtml(r.team || '—')}</td>` : ''}
            <td class="col-num"><strong>${escapeHtml(r.points ?? 0)}</strong></td>
          </tr>
        `;
      }).join('');

      els.modalBody.innerHTML = `
        <div class="sub-tabs">
          ${subTabsHtml}
          ${st.updated ? `<span class="updated-note">${escapeHtml(st.updated)}</span>` : ''}
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>#</th>
                <th>${activeStandingsType === 'drivers' ? 'Пилот' : 'Команда'}</th>
                ${hasTeamCol ? '<th>Команда</th>' : ''}
                <th class="col-num">Очки</th>
              </tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    /* --- События --- */
    els.list.addEventListener('click', e => {
      if (!ENABLE_MODAL) return;
      if (e.target.closest('a')) return;
      const card = e.target.closest('.card');
      if (!card) return;
      const race = allRaces.find(r => r._id === Number(card.dataset.id));
      if (race) openModal(race);
    });

    els.modalTabs.addEventListener('click', e => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      activeTab = btn.dataset.tab;
      renderModalContent();
    });

    els.modalBody.addEventListener('click', e => {
      const btn = e.target.closest('.sub-tab-btn');
      if (!btn) return;
      activeStandingsType = btn.dataset.st;
      renderModalContent();
    });

    els.modalClose.addEventListener('click', closeModal);
    els.backdrop.addEventListener('click', e => {
      if (e.target === els.backdrop) closeModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && currentRace) closeModal();
    });

    ['change', 'input'].forEach(evt => {
      [els.series, els.tag, els.country, els.from, els.to, els.search, els.hidePast]
        .forEach(el => el.addEventListener(evt, render));
    });

    els.reset.addEventListener('click', () => {
      els.series.value = '';
      els.tag.value = '';
      els.country.value = '';
      els.from.value = '';
      els.to.value = '';
      els.search.value = '';
      els.hidePast.checked = true;
      render();
    });

    async function init() {
      try {
        const racesRes = await fetch('./races.json');
        if (!racesRes.ok) throw new Error('races.json load failed');
        const data = await racesRes.json();

        if (SHOW_STANDINGS) {
          try {
            const stRes = await fetch('./standings.json');
            if (stRes.ok) standingsData = await stRes.json();
          } catch {
            standingsData = {};
          }
        }

        allRaces = data
          .map((r, idx) => ({
            ...r,
            _id: idx,
            _ts: new Date(r.start).getTime(),
            _tags: normalizeTags(r)
          }))
          .sort((a, b) => a._ts - b._ts);

        populateSelect(els.series, allRaces.map(r => r.series));
        populateSelect(els.tag, allRaces.flatMap(r => r._tags), PRIORITY_TAGS);
        populateSelect(els.country, allRaces.map(r => r.country));
        render();
      } catch (err) {
        els.list.innerHTML = `
          <div class="error">
            Не удалось загрузить <b>races.json</b>.<br>
            Если открыл файл двойным кликом с диска, браузер блокирует чтение JSON (CORS).<br>
            На GitHub Pages всё заработает само, а локально запусти в папке с файлами:<br>
            <code>python -m http.server 8000</code>
          </div>`;
      }
    }

    init();
  </script>
</body>
</html>
